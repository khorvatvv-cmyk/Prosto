services:
  - type: web
    name: prosto-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix server ci && npm run build
    startCommand: node server/index.js
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: ASSISTANT_ID
        sync: false
      - key: ASSISTANT_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 22.22.0
